name: AI Radar

on:
  # No schedule: the bot runs on Render (python radar.py --serve). Two bots would post everything twice.
  workflow_dispatch:          # "Run workflow" button, and what cron-job.org calls
    inputs:
      mode:
        description: "all = check every tracker, scheduled = only the ones due (5/15/30 min)"
        default: all

permissions:
  contents: write             # needed to save state/seen.json back to the repo

concurrency:
  group: ai-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run radar
        env:
          DISCORD_WEBHOOK_OPENROUTER: ${{ secrets.DISCORD_WEBHOOK_OPENROUTER }}
          DISCORD_WEBHOOK_ARENAS: ${{ secrets.DISCORD_WEBHOOK_ARENAS }}
          DISCORD_WEBHOOK_PAGES: ${{ secrets.DISCORD_WEBHOOK_PAGES }}
          DISCORD_WEBHOOK_RELEASES: ${{ secrets.DISCORD_WEBHOOK_RELEASES }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_API_MODELS: ${{ secrets.DISCORD_WEBHOOK_API_MODELS }}
          DISCORD_WEBHOOK_HUGGINGFACE: ${{ secrets.DISCORD_WEBHOOK_HUGGINGFACE }}
          DISCORD_WEBHOOK_SUBDOMAINS: ${{ secrets.DISCORD_WEBHOOK_SUBDOMAINS }}
          DISCORD_WEBHOOK_NEWREPOS: ${{ secrets.DISCORD_WEBHOOK_NEWREPOS }}
          DISCORD_WEBHOOK_GOOGLE_CLOUD: ${{ secrets.DISCORD_WEBHOOK_GOOGLE_CLOUD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_CLOUD: ${{ secrets.DISCORD_WEBHOOK_CLOUD }}
          DISCORD_WEBHOOK_TOOLS: ${{ secrets.DISCORD_WEBHOOK_TOOLS }}
          DISCORD_WEBHOOK_BENCHMARKS: ${{ secrets.DISCORD_WEBHOOK_BENCHMARKS }}
          DISCORD_WEBHOOK_STATUS: ${{ secrets.DISCORD_WEBHOOK_STATUS }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          DISCORD_ROLE_API_MODELS: ${{ secrets.DISCORD_ROLE_API_MODELS }}
          DISCORD_ROLE_HUGGINGFACE: ${{ secrets.DISCORD_ROLE_HUGGINGFACE }}
          DISCORD_ROLE_SUBDOMAINS: ${{ secrets.DISCORD_ROLE_SUBDOMAINS }}
          DISCORD_ROLE_NEWREPOS: ${{ secrets.DISCORD_ROLE_NEWREPOS }}
          DISCORD_ROLE_CLOUD: ${{ secrets.DISCORD_ROLE_CLOUD }}
          DISCORD_ROLE_TOOLS: ${{ secrets.DISCORD_ROLE_TOOLS }}
          DISCORD_ROLE_BENCHMARKS: ${{ secrets.DISCORD_ROLE_BENCHMARKS }}
          DISCORD_ROLE_STATUS: ${{ secrets.DISCORD_ROLE_STATUS }}
          DISCORD_ROLE_OPENROUTER: ${{ secrets.DISCORD_ROLE_OPENROUTER }}
          DISCORD_ROLE_ARENAS: ${{ secrets.DISCORD_ROLE_ARENAS }}
          DISCORD_ROLE_DESIGNARENA: ${{ secrets.DISCORD_ROLE_DESIGNARENA }}
          DISCORD_ROLE_PAGES: ${{ secrets.DISCORD_ROLE_PAGES }}
          DISCORD_ROLE_RELEASES: ${{ secrets.DISCORD_ROLE_RELEASES }}
          RADAR_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || inputs.mode }}
        run: python radar.py
      - name: Save state
        run: |
          git config user.name "ai-radar"
          git config user.email "ai-radar@users.noreply.github.com"
          git add state/seen.json
          git diff --staged --quiet || (git commit -m "radar: update seen state" && git pull --rebase -X theirs origin main && git push)
